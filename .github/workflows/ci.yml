name: PicoT Core CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "price-driven-*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Pytest, Ruff and Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run Ruff on PicoT Core slice
        run: >-
          ruff check src/picot
          tests/test_planner_strategy.py
          tests/test_planning_input_snapshot.py
          tests/test_household_state.py
          tests/test_forecast.py
          tests/test_opportunity_engine.py
          tests/test_pv_surplus_opportunity.py
          tests/test_lowest_price_opportunity.py
          tests/test_high_export_value_opportunity.py
          tests/test_candidate.py
          tests/test_energy_path_capability_snapshot.py
          tests/test_candidate_engine.py
          tests/test_evaluation_engine.py
          tests/test_execution_plan_builder.py
          tests/test_execution_engine.py
          tests/test_runtime_monitor.py
          tests/test_home_assistant_adapter.py
          tests/test_home_assistant_http_transport.py
          tests/test_home_assistant_dry_run.py
          tests/test_home_assistant_commissioning.py
          tests/test_morning_protection_strategy.py
          tests/test_price_driven_strategy.py
          tests/test_home_assistant_addon_runtime.py
          tests/test_home_assistant_household_state.py
          tests/test_home_assistant_dashboard.py
          tests/test_home_assistant_solcast.py
          tests/test_home_assistant_solcast_observer.py
          tests/test_home_assistant_goodwe.py
          tests/test_home_assistant_goodwe_observer.py
          tests/test_home_assistant_goodwe_dashboard.py
          tests/test_home_assistant_runtime_observation.py
          tests/test_home_assistant_zendure.py
          tests/test_home_assistant_zendure_observer.py
          tests/test_home_assistant_zendure_dashboard.py
          tests/test_live_storage_pv_inputs.py

      - name: Run Mypy on PicoT Core slice
        run: >-
          mypy src/picot
          tests/test_planner_strategy.py
          tests/test_planning_input_snapshot.py
          tests/test_household_state.py
          tests/test_forecast.py
          tests/test_opportunity_engine.py
          tests/test_pv_surplus_opportunity.py
          tests/test_lowest_price_opportunity.py
          tests/test_high_export_value_opportunity.py
          tests/test_candidate.py
          tests/test_energy_path_capability_snapshot.py
          tests/test_candidate_engine.py
          tests/test_evaluation_engine.py
          tests/test_execution_plan_builder.py
          tests/test_execution_engine.py
          tests/test_runtime_monitor.py
          tests/test_home_assistant_adapter.py
          tests/test_home_assistant_http_transport.py
          tests/test_home_assistant_dry_run.py
          tests/test_home_assistant_commissioning.py
          tests/test_morning_protection_strategy.py
          tests/test_price_driven_strategy.py
          tests/test_home_assistant_addon_runtime.py
          tests/test_home_assistant_household_state.py
          tests/test_home_assistant_dashboard.py
          tests/test_home_assistant_solcast.py
          tests/test_home_assistant_solcast_observer.py
          tests/test_home_assistant_goodwe.py
          tests/test_home_assistant_goodwe_observer.py
          tests/test_home_assistant_goodwe_dashboard.py
          tests/test_home_assistant_runtime_observation.py
          tests/test_home_assistant_zendure.py
          tests/test_home_assistant_zendure_observer.py
          tests/test_home_assistant_zendure_dashboard.py
          tests/test_live_storage_pv_inputs.py

      - name: Run Pytest on PicoT Core slice
        run: >-
          pytest -q
          tests/test_planner_strategy.py
          tests/test_planning_input_snapshot.py
          tests/test_household_state.py
          tests/test_forecast.py
          tests/test_opportunity_engine.py
          tests/test_pv_surplus_opportunity.py
          tests/test_lowest_price_opportunity.py
          tests/test_high_export_value_opportunity.py
          tests/test_candidate.py
          tests/test_energy_path_capability_snapshot.py
          tests/test_candidate_engine.py
          tests/test_evaluation_engine.py
          tests/test_execution_plan_builder.py
          tests/test_execution_engine.py
          tests/test_runtime_monitor.py
          tests/test_home_assistant_adapter.py
          tests/test_home_assistant_http_transport.py
          tests/test_home_assistant_dry_run.py
          tests/test_home_assistant_commissioning.py
          tests/test_morning_protection_strategy.py
          tests/test_price_driven_strategy.py
          tests/test_home_assistant_addon_runtime.py
          tests/test_home_assistant_household_state.py
          tests/test_home_assistant_dashboard.py
          tests/test_home_assistant_solcast.py
          tests/test_home_assistant_solcast_observer.py
          tests/test_home_assistant_goodwe.py
          tests/test_home_assistant_goodwe_observer.py
          tests/test_home_assistant_goodwe_dashboard.py
          tests/test_home_assistant_runtime_observation.py
          tests/test_home_assistant_zendure.py
          tests/test_home_assistant_zendure_observer.py
          tests/test_home_assistant_zendure_dashboard.py
          tests/test_live_storage_pv_inputs.py
