title: PicoT HEMS
views:
  - title: PicoT
    path: picot
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 4
    sections:
      - type: grid
        title: Overzicht
        column_span: 4
        cards:
          - type: glance
            title: PicoT in één oogopslag
            columns: 6
            entities:
              - entity: sensor.picot_current_price
                name: Prijs
              - entity: sensor.picot_solcast_expected_power
                name: PV verwacht
              - entity: sensor.picot_goodwe_power
                name: PV werkelijk
              - entity: sensor.picot_grid_power
                name: Net
              - entity: sensor.picot_operating_mode
                name: Modus
              - entity: sensor.picot_dispatch_status
                name: Dispatch

      - type: grid
        title: Vermogensvergelijking
        column_span: 4
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Power Comparison
              show_states: true
              colorize_states: true
            graph_span: 24h
            span:
              start: day
            now:
              show: true
              label: Nu
            update_interval: 5sec
            yaxis:
              - id: power
                decimals: 0
                apex_config:
                  title:
                    text: Vermogen (W)
            apex_config:
              chart:
                height: 420
                toolbar:
                  show: true
                zoom:
                  enabled: true
              dataLabels:
                enabled: false
              stroke:
                curve: smooth
              grid:
                strokeDashArray: 4
              fill:
                type: solid
              legend:
                show: true
              tooltip:
                shared: true
                intersect: false
              annotations:
                yaxis:
                  - y: 0
                    borderWidth: 2
                    strokeDashArray: 0
                    label:
                      show: false
            series:
              - entity: sensor.picot_zendure_power
                name: Zendure batterijvermogen
                type: area
                color: "#4caf50"
                curve: smooth
                stroke_width: 2
                opacity: 0.28
                extend_to: false
                group_by:
                  func: avg
                  duration: 1min
              - entity: sensor.picot_grid_power
                name: P1 netvermogen
                type: area
                color: "#f5f5f5"
                curve: smooth
                stroke_width: 2
                opacity: 0.32
                extend_to: false
                group_by:
                  func: avg
                  duration: 1min
              - entity: sensor.picot_goodwe_power
                name: GoodWe PV-vermogen
                type: line
                color: "#ffb300"
                curve: smooth
                stroke_width: 2
                extend_to: false
                group_by:
                  func: avg
                  duration: 1min
              - entity: sensor.picot_house_power
                name: Huisverbruik (afgeleid)
                type: line
                color: "#1e88e5"
                curve: smooth
                stroke_width: 2
                extend_to: false
                group_by:
                  func: avg
                  duration: 1min
          - type: entities
            title: Batterij en vermogensstatus
            show_header_toggle: false
            entities:
              - entity: sensor.picot_zendure_status
                name: Zendure status
              - entity: sensor.picot_zendure_soc
                name: Laadpercentage
              - entity: sensor.picot_zendure_actual_mode
                name: Werkelijke modus
              - entity: sensor.picot_zendure_requested_mode
                name: Aangevraagde modus
              - entity: sensor.picot_zendure_power
                name: Batterijvermogen
              - entity: sensor.picot_house_power
                name: Huisverbruik

      - type: grid
        title: Zon en werkelijkheid
        column_span: 4
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Solcast forecast versus GoodWe
              show_states: true
              colorize_states: true
            graph_span: 24h
            span:
              start: day
            now:
              show: true
              label: Nu
            update_interval: 5min
            yaxis:
              - min: 0
                decimals: 0
                apex_config:
                  title:
                    text: Vermogen (W)
            apex_config:
              chart:
                height: 340
              stroke:
                width: 3
              legend:
                show: true
              tooltip:
                shared: true
                intersect: false
            series:
              - entity: sensor.picot_solcast_today
                name: Solcast verwacht
                type: line
                curve: smooth
                stroke_width: 3
                extend_to: false
                data_generator: |
                  const points = entity.attributes.detailedForecast || [];
                  return points.map((point) => [
                    new Date(point.period_start).getTime(),
                    Number(point.pv_estimate) * 1000
                  ]);
              - entity: sensor.picot_solcast_today
                name: Solcast conservatief (P10)
                type: line
                curve: smooth
                stroke_width: 1
                opacity: 0.45
                extend_to: false
                data_generator: |
                  const points = entity.attributes.detailedForecast || [];
                  return points.map((point) => [
                    new Date(point.period_start).getTime(),
                    Number(point.pv_estimate10) * 1000
                  ]);
              - entity: sensor.picot_solcast_today
                name: Solcast optimistisch (P90)
                type: line
                curve: smooth
                stroke_width: 1
                opacity: 0.45
                extend_to: false
                data_generator: |
                  const points = entity.attributes.detailedForecast || [];
                  return points.map((point) => [
                    new Date(point.period_start).getTime(),
                    Number(point.pv_estimate90) * 1000
                  ]);
              - entity: sensor.picot_goodwe_power
                name: GoodWe werkelijk
                type: line
                curve: smooth
                stroke_width: 2
                extend_to: false
                group_by:
                  func: avg
                  duration: 5min
          - type: entities
            title: PV-validatie
            show_header_toggle: false
            entities:
              - entity: sensor.picot_solcast_status
                name: Solcast status
              - entity: sensor.picot_goodwe_status
                name: GoodWe status
              - entity: sensor.picot_solcast_today
                name: Forecast vandaag
              - entity: sensor.picot_goodwe_generation_today
                name: Werkelijk vandaag
              - entity: sensor.picot_solcast_remaining_today
                name: Resterende forecast
              - entity: sensor.picot_solcast_confidence
                name: Confidence
              - entity: sensor.picot_goodwe_temperature
                name: Omvormertemperatuur

      - type: grid
        title: Prijs en planning
        column_span: 4
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Elektriciteitsprijs
              show_states: true
              colorize_states: true
            graph_span: 24h
            span:
              start: day
            now:
              show: true
              label: Nu
            yaxis:
              - decimals: 3
                apex_config:
                  title:
                    text: EUR/kWh
            apex_config:
              chart:
                height: 300
              stroke:
                width: 3
              annotations:
                yaxis: []
            series:
              - entity: sensor.picot_current_price
                name: Werkelijke prijs
                type: line
                curve: stepline
                stroke_width: 3
                extend_to: false
                group_by:
                  func: avg
                  duration: 15min
          - type: entities
            title: Gekozen prijsvenster
            show_header_toggle: false
            entities:
              - entity: sensor.picot_active_price_window
                name: Venster actief
              - type: attribute
                entity: sensor.picot_current_price
                attribute: selected_window_average
                name: Gemiddelde prijs venster
              - type: attribute
                entity: sensor.picot_current_price
                attribute: window_starts_at
                name: Start
              - type: attribute
                entity: sensor.picot_current_price
                attribute: window_ends_at
                name: Einde

      - type: grid
        title: PicoT-brein
        column_span: 2
        cards:
          - type: entities
            title: Actuele beslissing
            show_header_toggle: false
            entities:
              - entity: sensor.picot_hems_status
                name: PicoT-status
              - entity: sensor.picot_operating_mode
                name: Huidige modus
              - entity: sensor.picot_desired_mode
                name: Gewenste modus
              - entity: sensor.picot_dispatch_status
                name: Laatste dispatch
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: strategy
                name: Strategie
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: reason
                name: Reden
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: last_planner_run
                name: Laatste planner-run

      - type: grid
        title: Woning en net
        column_span: 2
        cards:
          - type: glance
            title: Live energiestroom
            columns: 3
            entities:
              - entity: sensor.picot_grid_power
                name: Netto
              - entity: sensor.picot_grid_import
                name: Import
              - entity: sensor.picot_grid_export
                name: Export
          - type: entities
            title: Bronstatus
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: p1_status
                name: P1-status
              - entity: sensor.picot_solcast_status
                name: Solcast
              - entity: sensor.picot_goodwe_status
                name: GoodWe
              - entity: sensor.picot_zendure_status
                name: Zendure
              - type: attribute
                entity: sensor.picot_grid_power
                attribute: telemetry_updated_at
                name: Laatste telemetrie

      - type: grid
        title: Uitleg
        column_span: 4
        cards:
          - type: markdown
            content: |
              ## Waarom doet PicoT dit?

              **Strategie:** {{ state_attr('sensor.picot_hems_status', 'strategy') }}

              **Reden:** {{ state_attr('sensor.picot_hems_status', 'reason') }}

              **Huidige modus:** {{ states('sensor.picot_operating_mode') }}

              **Gewenste modus:** {{ states('sensor.picot_desired_mode') }}

              **Prijsvenster:** {{ state_attr('sensor.picot_current_price', 'window_starts_at') }} tot {{ state_attr('sensor.picot_current_price', 'window_ends_at') }}

              Dit dashboard is een technische observatie- en validatielaag. Solcast, GoodWe en Zendure-observatie hebben nog geen invloed op de planner.
