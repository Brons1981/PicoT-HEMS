# PicoT HEMS - dynamic price chart with Price Driven v2 opportunity overlay
# Observation/visualisation only. This card does not influence planner control.
type: custom:apexcharts-card
grid_options:
  columns: full
  rows: 8
header:
  show: true
  title: Dynamische elektriciteitsprijzen
  show_states: false
graph_span: 24h
span:
  start: day
now:
  show: true
  label: Nu
update_interval: 30sec
yaxis:
  - id: price
    decimals: 3
    apex_config:
      title:
        text: EUR/kWh
  - id: overlay
    min: 0
    max: 1
    decimals: 0
    show: false
apex_config:
  chart:
    height: 430
    toolbar:
      show: true
      autoSelected: pan
    zoom:
      enabled: true
      type: x
      autoScaleYaxis: true
      allowMouseWheelZoom: false
    selection:
      enabled: false
    animations:
      enabled: false
  dataLabels:
    enabled: false
  grid:
    strokeDashArray: 4
  legend:
    show: true
    onItemClick:
      toggleDataSeries: true
  tooltip:
    shared: true
    intersect: false
series:
  - entity: sensor.picot_current_price
    name: PicoT kwartierprijzen
    yaxis_id: price
    float_precision: 3
    type: area
    color: "#42a5f5"
    curve: stepline
    stroke_width: 2
    opacity: 0.22
    extend_to: false
    data_generator: |-
      const picotAttributes = entity.attributes || {};
      const picotRows = picotAttributes.price_points || [];

      if (picotRows.length > 0) {
        return picotRows
          .map((row) => {
            const start = row.start || row.starts_at || row.time;
            const value = row.value ?? row.price;
            return [new Date(start).getTime(), Number(value)];
          })
          .filter((point) => Number.isFinite(point[0]) && Number.isFinite(point[1]))
          .sort((a, b) => a[0] - b[0]);
      }

      const source = hass.states['sensor.nordpool_kwh_nl_eur_3_095_0'];
      const attributes = source?.attributes || {};
      const rawRows = [
        ...(attributes.raw_today || []),
        ...(attributes.raw_tomorrow || []),
      ];

      return rawRows
        .map((row) => {
          const start = row.start || row.starts_at || row.time;
          const value = row.value ?? row.price;
          return [new Date(start).getTime(), Number(value)];
        })
        .filter((point) => Number.isFinite(point[0]) && Number.isFinite(point[1]))
        .sort((a, b) => a[0] - b[0]);

  - entity: sensor.picot_price_opportunity_overlay
    name: PicoT price opportunity
    yaxis_id: overlay
    type: area
    color: "#66bb6a"
    curve: straight
    stroke_width: 0
    opacity: 0.22
    extend_to: false
    show:
      legend_value: false
    data_generator: |-
      const attrs = entity.attributes || {};
      const start = new Date(attrs.starts_at || '').getTime();
      const end = new Date(attrs.ends_at || '').getTime();
      if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return [];
      return [
        [start, 0],
        [start + 1000, 1],
        [end - 1000, 1],
        [end, 0]
      ];

  - entity: sensor.picot_best_later_price
    name: Beste latere start
    yaxis_id: overlay
    type: line
    color: "#ff9800"
    curve: straight
    stroke_width: 3
    opacity: 1
    extend_to: false
    show:
      legend_value: false
    data_generator: |-
      const attrs = entity.attributes || {};
      const start = new Date(attrs.starts_at || '').getTime();
      if (!Number.isFinite(start)) return [];
      return [
        [start, 0],
        [start + 1000, 1]
      ];
