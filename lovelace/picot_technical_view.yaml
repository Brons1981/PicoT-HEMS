title: PicoT Technical View
views:
  - title: PicoT
    path: picot
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        title: Externe wereld
        cards:
          - type: entities
            title: Prijs en bron
            show_header_toggle: false
            entities:
              - entity: sensor.picot_current_price
                name: Actuele prijs
              - type: attribute
                entity: sensor.picot_current_price
                attribute: selected_window_average
                name: Gemiddelde gekozen venster
              - type: attribute
                entity: sensor.picot_current_price
                attribute: window_starts_at
                name: Venster start
              - type: attribute
                entity: sensor.picot_current_price
                attribute: window_ends_at
                name: Venster einde
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: p1_status
                name: P1-status

      - type: grid
        title: PicoT-brein
        cards:
          - type: entities
            title: Actuele beslissing
            show_header_toggle: false
            entities:
              - entity: sensor.picot_hems_status
                name: PicoT-status
              - entity: sensor.picot_operating_mode
                name: Huidige modus
              - entity: sensor.picot_desired_mode
                name: Gewenste modus
              - entity: sensor.picot_dispatch_status
                name: Laatste dispatch
              - entity: sensor.picot_active_price_window
                name: Prijsvenster actief
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: strategy
                name: Strategie
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: reason
                name: Reden
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: last_planner_run
                name: Laatste planner-run

      - type: grid
        title: Woning en net
        cards:
          - type: glance
            title: Live energiestroom
            columns: 4
            entities:
              - entity: sensor.picot_house_power
                name: Huis
              - entity: sensor.picot_grid_power
                name: Netto
              - entity: sensor.picot_grid_import
                name: Import
              - entity: sensor.picot_grid_export
                name: Export
          - type: entities
            title: Telemetrie
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.picot_grid_power
                attribute: direction
                name: Richting
              - type: attribute
                entity: sensor.picot_grid_power
                attribute: source_entity
                name: Bron
              - type: attribute
                entity: sensor.picot_grid_power
                attribute: measured_at
                name: Gemeten om
              - type: attribute
                entity: sensor.picot_grid_power
                attribute: telemetry_updated_at
                name: Dashboard bijgewerkt

      - type: grid
        title: Power Comparison
        column_span: 3
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Power Comparison
              show_states: true
              colorize_states: true
            graph_span: 24h
            span:
              start: day
            now:
              show: true
              label: Nu
            update_interval: 5sec
            yaxis:
              - id: power
                decimals: 0
                apex_config:
                  title:
                    text: Vermogen (W)
            apex_config:
              chart:
                height: 420
                toolbar:
                  show: true
                zoom:
                  enabled: true
              dataLabels:
                enabled: false
              stroke:
                curve: smooth
              grid:
                strokeDashArray: 4
              fill:
                type: solid
              legend:
                show: true
              tooltip:
                shared: true
                intersect: false
              annotations:
                yaxis:
                  - y: 0
                    borderWidth: 2
                    strokeDashArray: 0
                    label:
                      show: false
            series:
              - entity: sensor.picot_zendure_power
                name: Zendure batterijvermogen
                type: area
                color: "#4caf50"
                curve: smooth
                stroke_width: 2
                opacity: 0.28
                extend_to: false
                group_by:
                  func: avg
                  duration: 1min
              - entity: sensor.picot_grid_power
                name: P1 netvermogen
                type: area
                color: "#f5f5f5"
                curve: smooth
                stroke_width: 2
                opacity: 0.32
                extend_to: false
                group_by:
                  func: avg
                  duration: 1min
              - entity: sensor.picot_goodwe_power
                name: GoodWe PV-vermogen
                type: line
                color: "#ffb300"
                curve: smooth
                stroke_width: 2
                extend_to: false
                group_by:
                  func: avg
                  duration: 1min
              - entity: sensor.picot_house_power
                name: Huisverbruik (afgeleid)
                type: line
                color: "#1e88e5"
                curve: smooth
                stroke_width: 2
                extend_to: false
                group_by:
                  func: avg
                  duration: 1min
          - type: entities
            title: Actuele vermogensstatus
            show_header_toggle: false
            entities:
              - entity: sensor.picot_zendure_power
                name: Zendure batterijvermogen
              - entity: sensor.picot_zendure_soc
                name: Zendure SoC
              - entity: sensor.picot_zendure_actual_mode
                name: Werkelijke batterijmodus
              - entity: sensor.picot_grid_power
                name: P1 netvermogen
              - entity: sensor.picot_goodwe_power
                name: GoodWe PV-vermogen
              - entity: sensor.picot_house_power
                name: Huisverbruik

      - type: grid
        title: Historie vandaag
        column_span: 3
        cards:
          - type: history-graph
            title: Netvermogen, import en export
            hours_to_show: 24
            entities:
              - entity: sensor.picot_grid_power
                name: Netto
              - entity: sensor.picot_grid_import
                name: Import
              - entity: sensor.picot_grid_export
                name: Export
          - type: history-graph
            title: Elektriciteitsprijs
            hours_to_show: 24
            entities:
              - entity: sensor.picot_current_price
                name: Actuele prijs
          - type: history-graph
            title: PicoT-modus en prijsvenster
            hours_to_show: 24
            entities:
              - entity: sensor.picot_operating_mode
                name: Huidige modus
              - entity: sensor.picot_desired_mode
                name: Gewenste modus
              - entity: sensor.picot_active_price_window
                name: Prijsvenster actief

      - type: grid
        title: Runtime en lagen
        column_span: 3
        cards:
          - type: entities
            title: Runtime
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: planner_interval_seconds
                name: Planner-interval
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: telemetry_interval_seconds
                name: Telemetrie-interval
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: last_telemetry_update
                name: Laatste telemetrie-update
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: p1_error
                name: Laatste P1-fout
          - type: entities
            title: Gekoppelde cockpitlagen
            show_header_toggle: false
            entities:
              - entity: sensor.picot_solcast_status
                name: PV-forecast (Solcast)
              - entity: sensor.picot_goodwe_status
                name: PV-opwek (GoodWe)
              - entity: sensor.picot_zendure_status
                name: Batterij (Zendure)
              - entity: sensor.picot_zendure_soc
                name: Batterij-SoC
              - entity: sensor.picot_zendure_power
                name: Batterijvermogen
              - entity: sensor.picot_grid_power
                name: P1-netmeting
          - type: markdown
            content: |
              ## Nog voorbereid

              - Omgeving en weer: nog niet gekoppeld
              - EV-status en planning: nog niet gekoppeld
              - Safety Layer en User Rules: volgen later

              **Nu actief:** prijs, P1, Solcast, GoodWe, Zendure en afgeleid huisvermogen.
