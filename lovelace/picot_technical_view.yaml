title: PicoT Cockpit v0.1
views:
  - title: PicoT
    path: picot
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 4
    sections:
      - type: grid
        title: Live energie
        column_span: 4
        cards:
          - type: glance
            title: Actuele vermogens
            columns: 4
            show_name: true
            show_state: true
            entities:
              - entity: sensor.picot_grid_power
                name: Net
                icon: mdi:transmission-tower
              - entity: sensor.picot_goodwe_power
                name: PV
                icon: mdi:solar-power
              - entity: sensor.picot_zendure_power
                name: Batterij
                icon: mdi:battery-charging-medium
              - entity: sensor.picot_house_power
                name: Huis
                icon: mdi:home-lightning-bolt

      - type: grid
        title: Power Comparison
        column_span: 4
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Power Comparison
              show_states: true
              colorize_states: true
            graph_span: 24h
            span:
              start: day
            now:
              show: true
              label: Nu
            update_interval: 5sec
            yaxis:
              - id: power
                decimals: 0
                apex_config:
                  title:
                    text: Vermogen (W)
            apex_config:
              chart:
                height: 430
                toolbar:
                  show: true
                zoom:
                  enabled: true
              dataLabels:
                enabled: false
              stroke:
                curve: smooth
              grid:
                strokeDashArray: 4
              fill:
                type: solid
              legend:
                show: true
              tooltip:
                shared: true
                intersect: false
              annotations:
                yaxis:
                  - y: 0
                    borderWidth: 2
                    strokeDashArray: 0
                    label:
                      show: false
            series:
              - entity: sensor.picot_zendure_power
                name: Zendure batterijvermogen
                type: area
                color: "#4caf50"
                curve: smooth
                stroke_width: 2
                opacity: 0.24
                extend_to: false
                group_by:
                  func: avg
                  duration: 1min
              - entity: sensor.picot_grid_power
                name: P1 netvermogen
                type: area
                color: "#f5f5f5"
                curve: smooth
                stroke_width: 2
                opacity: 0.30
                extend_to: false
                group_by:
                  func: avg
                  duration: 1min
              - entity: sensor.picot_goodwe_power
                name: GoodWe PV-vermogen
                type: line
                color: "#ffb300"
                curve: smooth
                stroke_width: 2
                extend_to: false
                group_by:
                  func: avg
                  duration: 1min
              - entity: sensor.picot_house_power
                name: Huisverbruik (afgeleid)
                type: line
                color: "#1e88e5"
                curve: smooth
                stroke_width: 2
                extend_to: false
                group_by:
                  func: avg
                  duration: 1min

      - type: grid
        title: Batterij
        column_span: 2
        cards:
          - type: entities
            title: Zendure
            show_header_toggle: false
            entities:
              - entity: sensor.picot_zendure_status
                name: Status
              - entity: sensor.picot_zendure_soc
                name: Laadpercentage
              - entity: sensor.picot_zendure_power
                name: Batterijvermogen
              - entity: sensor.picot_zendure_actual_mode
                name: Werkelijke modus
              - entity: sensor.picot_zendure_requested_mode
                name: Aangevraagde modus
              - entity: sensor.picot_zendure_soc_limit
                name: SoC-limiet
              - entity: sensor.picot_zendure_error
                name: Foutstatus

      - type: grid
        title: Prijs en planner
        column_span: 2
        cards:
          - type: entities
            title: Actuele beslissing
            show_header_toggle: false
            entities:
              - entity: sensor.picot_current_price
                name: Actuele prijs
              - entity: sensor.picot_active_price_window
                name: Prijsvenster actief
              - entity: sensor.picot_operating_mode
                name: Huidige modus
              - entity: sensor.picot_desired_mode
                name: Gewenste modus
              - entity: sensor.picot_dispatch_status
                name: Laatste dispatch
              - type: attribute
                entity: sensor.picot_current_price
                attribute: selected_window_average
                name: Gemiddelde prijs venster
              - type: attribute
                entity: sensor.picot_current_price
                attribute: window_starts_at
                name: Venster start
              - type: attribute
                entity: sensor.picot_current_price
                attribute: window_ends_at
                name: Venster einde
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: reason
                name: Reden

      - type: grid
        title: Zon en forecast
        column_span: 4
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Solcast versus GoodWe
              show_states: true
              colorize_states: true
            graph_span: 24h
            span:
              start: day
            now:
              show: true
              label: Nu
            yaxis:
              - min: 0
                decimals: 0
                apex_config:
                  title:
                    text: Vermogen (W)
            apex_config:
              chart:
                height: 320
              stroke:
                width: 3
              legend:
                show: true
              tooltip:
                shared: true
                intersect: false
            series:
              - entity: sensor.picot_solcast_expected_power
                name: Solcast verwacht
                type: line
                curve: smooth
                stroke_width: 3
                extend_to: false
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.picot_goodwe_power
                name: GoodWe werkelijk
                type: line
                curve: smooth
                stroke_width: 2
                extend_to: false
                group_by:
                  func: avg
                  duration: 5min
          - type: entities
            title: PV-validatie
            show_header_toggle: false
            entities:
              - entity: sensor.picot_solcast_status
                name: Solcast status
              - entity: sensor.picot_goodwe_status
                name: GoodWe status
              - entity: sensor.picot_solcast_today
                name: Forecast vandaag
              - entity: sensor.picot_goodwe_generation_today
                name: Werkelijk vandaag
              - entity: sensor.picot_solcast_remaining_today
                name: Resterende forecast
              - entity: sensor.picot_solcast_confidence
                name: Confidence

      - type: grid
        title: Bronstatus en runtime
        column_span: 4
        cards:
          - type: entities
            title: Databronnen
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: p1_status
                name: P1-status
              - entity: sensor.picot_solcast_status
                name: Solcast
              - entity: sensor.picot_goodwe_status
                name: GoodWe
              - entity: sensor.picot_zendure_status
                name: Zendure
              - type: attribute
                entity: sensor.picot_grid_power
                attribute: telemetry_updated_at
                name: Laatste telemetrie
              - type: attribute
                entity: sensor.picot_hems_status
                attribute: last_planner_run
                name: Laatste planner-run
          - type: markdown
            content: |
              ## Cockpit v0.1

              **Nu actief:** prijs, P1, Solcast, GoodWe, Zendure en afgeleid huisvermogen.

              **Nog voorbereid:** omgeving en weer, EV-status en planning, Safety Layer en User Rules.

              Positief P1-vermogen betekent import; negatief betekent export. Positief Zendure-vermogen betekent laden; negatief betekent ontladen.
