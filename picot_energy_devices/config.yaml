name: PicoT Energy Devices
version: "0.2.0"
slug: picot_energy_devices
description: Leert energieprofielen van door de gebruiker gekozen Home Assistant-meetpunten
url: https://github.com/Brons1981/PicoT-HEMS
arch:
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8100
panel_icon: mdi:power-plug-outline
panel_title: Energy Devices
options:
  poll_interval_seconds: 10
  catalog_entity_id: "sensor.picot_energy_devices_catalog"
schema:
  poll_interval_seconds: int(5,300)
  catalog_entity_id: str
