name: PicoT HEMS
version: "0.1.28"
slug: picot_hems
description: Deterministic PicoT HEMS live-validation runtime
url: https://github.com/Brons1981/PicoT-HEMS
arch:
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:database-export-outline
options:
  mode: dry_run
  price_strategy: v1
  price_entity: sensor.nordpool_kwh_nl_eur_3_095_0
  target_entity: input_select.zendure_2400_ac_modus_selecteren
  p1_power_entity: sensor.ct_shelly_pro_3em_api
  p1_import_is_positive: true
  pv_power_entity: sensor.inverter_54200dsn211r0265_vermogen
  battery_power_entity: sensor.zendure_2400_ac_vermogen_aansturing
  battery_charge_is_positive: true
  window_points: 24
  price_opportunity_margin_eur_per_kwh: 0.04
  planner_interval_seconds: 60
  telemetry_interval_seconds: 5
  interval_seconds: 60
schema:
  mode: list(dry_run|live)
  price_strategy: list(v1|v2)
  price_entity: str
  target_entity: str
  p1_power_entity: str
  p1_import_is_positive: bool
  pv_power_entity: str
  battery_power_entity: str
  battery_charge_is_positive: bool
  window_points: int(1,24)
  price_opportunity_margin_eur_per_kwh: float(0,1)
  planner_interval_seconds: int(30,3600)
  telemetry_interval_seconds: int(1,60)
  interval_seconds: int(30,3600)
