[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "picot-hems"
version = "0.1.0"
description = "Deterministic Home Energy Management System core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
picot-commission = "picot.commissioning.home_assistant:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
  "mypy>=1.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/picot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
